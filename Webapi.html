<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Items</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        #counter {
            margin-bottom: 20px;
            text-align: center;
            font-size: 18px;
            color: #666;
        }

        #add-item-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        #add-name {
            width: 300px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
        }

        #add-button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #add-button:hover {
            background-color: #218838;
        }

        .todo-item {
            background-color: white;
            padding: 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .todo-item-name {
            flex: 1;
            font-size: 16px;
        }

        .todo-item-actions {
            display: flex;
            gap: 10px;
        }

        .todo-button {
            padding: 6px 12px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .edit-button {
            background-color: #007bff;
            color: white;
        }

        .edit-button:hover {
            background-color: #0056b3;
        }

        .delete-button {
            background-color: #dc3545;
            color: white;
        }

        .delete-button:hover {
            background-color: #c82333;
        }

        #editForm {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        #editForm input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #editForm input[type="checkbox"] {
            margin-right: 5px;
        }

        #save-button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        #save-button:hover {
            background-color: #218838;
        }

        #cancel-button {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            margin-left: 10px;
            cursor: pointer;
        }

        #cancel-button:hover {
            background-color: #5a6268;
        }

    </style>
</head>
<body>

    <h1>To-Do Items</h1>

    <div id="counter"></div>

    <div id="add-item-container">
        <input type="text" id="add-name" placeholder="Add new item..." />
        <button id="add-button" onclick="create()">Add Item</button>
    </div>

    <div id="todos"></div>

    <div id="editForm">
        <input type="hidden" id="edit-id" />
        <label for="edit-name">Edit Name:</label>
        <input type="text" id="edit-name" />
        <label for="edit-isComplete">
            <input type="checkbox" id="edit-isComplete" />
            Completed
        </label>
        <br />
        <button id="save-button" onclick="update()">Save</button>
        <button id="cancel-button" onclick="closeInput()">Cancel</button>
    </div>

    <script>
        const uri = "https://todoitems.buchwaldshave34.dk/api/todoitems";
        let items = [];
        let userName = "UserLTPE";

        function getItems() {
            fetch(uri + "?UserName=" + userName)
                .then(response => response.json())
                .then(data => _displayItems(data))
                .catch(error => console.error('Unable to get items.', error));
        }

        function create() {
            const addNameTextbox = document.getElementById('add-name');

            const item = {
                isComplete: false,
                name: addNameTextbox.value.trim(),
            };

            fetch(uri + "?UserName=" + userName, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(item),
            })
                .then(response => response.json())
                .then(() => {
                    getItems();
                    addNameTextbox.value = '';
                })
                .catch(error => console.error('Unable to add item.', error));
        }

        function deleteIt(id) {
            fetch(`${uri}/${id}` + "?UserName=" + userName, {
                method: 'DELETE'
            })
                .then(() => getItems())
                .catch(error => console.error('Unable to delete item.', error));
        }

        function displayEditForm(id) {
            const item = items.find(item => item.id === id);

            document.getElementById('edit-name').value = item.name;
            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-isComplete').checked = item.isComplete;
            document.getElementById('editForm').style.display = 'block';
        }

        function update() {
            const itemId = document.getElementById('edit-id').value;
            const item = {
                id: parseInt(itemId, 10),
                isComplete: document.getElementById('edit-isComplete').checked,
                name: document.getElementById('edit-name').value.trim()
            };

            fetch(`${uri}/${itemId}` + "?UserName=" + userName, {
                method: 'PUT',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(item)
            })
                .then(() => getItems())
                .catch(error => console.error('Unable to update item.', error));

            closeInput();
            return false;
        }

        function closeInput() {
            document.getElementById('editForm').style.display = 'none';
        }

        function _displayCount(itemCount) {
            const name = (itemCount === 1) ? 'to-do' : 'to-dos';
            document.getElementById('counter').innerText = `${itemCount} ${name}`;
        }

        function _displayItems(data) {
            const tBody = document.getElementById('todos');
            tBody.innerHTML = '';

            _displayCount(data.length);

            data.forEach(item => {
                let isCompleteCB = document.createElement('input');
                isCompleteCB.type = 'checkbox';
                isCompleteCB.disabled = true;
                isCompleteCB.checked = item.isComplete;

                let todoItem = document.createElement('div');
                todoItem.className = 'todo-item';

                let todoItemName = document.createElement('div');
                todoItemName.className = 'todo-item-name';
                todoItemName.textContent = item.name;

                let todoItemActions = document.createElement('div');
                todoItemActions.className = 'todo-item-actions';

                let editButton = document.createElement('button');
                editButton.className = 'todo-button edit-button';
                editButton.innerText = 'Edit';
                editButton.setAttribute('onclick', `displayEditForm(${item.id})`);

                let deleteButton = document.createElement('button');
                deleteButton.className = 'todo-button delete-button';
                deleteButton.innerText = 'Delete';
                deleteButton.setAttribute('onclick', `deleteItem(${item.id})`);

                todoItemActions.appendChild(editButton);
                todoItemActions.appendChild(deleteButton);

                todoItem.appendChild(isCompleteCB);
                todoItem.appendChild(todoItemName);
                todoItem.appendChild(todoItemActions);

                tBody.appendChild(todoItem);
            });

            items = data;
        }
        getItems();
    </script>

</body>
</html>
